[package]
name = "time-music"
version = "0.1.5"
description = "Time Music Player for Time OS"
authors = ["Time OS Team"]
edition = "2024"

[lib]
name = "time_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.23"
lofty = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7"
walkdir = "2.5"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "cookies", "form"] }
aes = "0.9.4"
cbc = "0.2.1"
urlencoding = "2.1"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
